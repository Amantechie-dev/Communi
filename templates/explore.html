<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - Communi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Explore Local Opportunities</h1>
    <a href="/dashboard">My Dashboard</a> | <a href="/create">Create Event</a>
    <hr>
    
    {% if events %}
        {% for event in events %}
            <div class="event-card" >
                <h3 style="margin: 0;">{{ event.title }}</h3>
                <p><strong>Location:</strong> {{ event.location }}</p>
                <p>{{ event.description }}</p>
                <p><small>Organizer: {{ event.organizer_email }}</small></p>
                <a href="/join/{{ event.id }}"><button>Join Event</button></a>
            </div>
        {% endfor %}
    {% else %}
        <p>No events found. Be the first to create one!</p>
    {% endif %}
</body>
</html>
