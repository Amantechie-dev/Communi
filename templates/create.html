





<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - Communi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="
    background-image: url('{{ url_for('static', filename='80464156-8c7a-463e-8487-cc44bce53d6c.jpg') }}'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed; 
    background-repeat: no-repeat;
">
    <nav class="navbar">
        <a href="/" class="logo"> Communi</a>
        <div class="nav-links">
            <a href="/explore">Explore</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container" style="max-width: 600px;">
        <h2>Host a Community Event</h2>
        <p style="color: #6b7280; margin-bottom: 25px;">Fill out the details below to broadcast your initiative to local volunteers instantly.</p>
        
        <form method="POST" class="card">
            <label>Event Title</label>
            <input type="text" name="title" placeholder="e.g., Downtown Park Cleanup" required>
            
            <label>Location / Address</label>
            <input type="text" name="location" placeholder="e.g., 123 Central Park Blvd, Delhi" required>
            
            <label>Event Description & Requirements</label>
            <textarea name="description" rows="4" placeholder="What will volunteers be doing? Are there any specific qualifications needed?" required></textarea>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Publish Event</button>

            <label>Event Duration (Hours)</label>
            <input type="number" name="hours" min="1" placeholder="e.g., 3" required>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Publish Event</button>
        </form>
    </div>
</body>
</html>
