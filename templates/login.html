<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Communi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="
    background-image: url('{{ url_for('static', filename='80464156-8c7a-463e-8487-cc44bce53d6c.jpg') }}'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed; 
    background-repeat: no-repeat;
">
    <nav class="navbar">
        <a href="/" class="logo"> Communi</a>
    </nav>

    <div class="container" style="max-width: 450px; margin-top: 60px;">
        <div class="card" style="text-align: center;">
            <h2>Welcome Back</h2>
            <p style="color: #6b7280; margin-bottom: 25px;">Enter your student or organizer email to continue.</p>
            
            <form method="POST" style="text-align: left;">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="e.g., volunteer@email.com" required>
                
                <button type="submit" class="btn" style="width: 100%;">Access Platform</button>
            </form>
        </div>
    </div>
</body>
</html>
